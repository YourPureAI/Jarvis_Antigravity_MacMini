<div class="space-y-4">
  <div class="p-4 rounded-xl bg-slate-950/80 border border-slate-800 space-y-3">
    <div class="text-xs font-semibold text-slate-300 flex items-center justify-between">
      <span>🛠️ Scaffold & Manage Modular Skills</span>
      <span class="text-[10px] text-slate-500">Autonomous Hermes-style tool extension</span>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
      <div>
        <label class="block text-slate-400 mb-1 font-medium">Skill Name (lowercase-hyphenated)</label>
        <input id="sc-name" type="text" placeholder="e.g. weather-alerts" class="w-full bg-slate-900 border border-slate-700/80 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono" />
      </div>
      <div>
        <label class="block text-slate-400 mb-1 font-medium">Pinned Packages (optional)</label>
        <input id="sc-pkgs" type="text" placeholder="e.g. httpx==0.28.1" class="w-full bg-slate-900 border border-slate-700/80 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono" />
      </div>
      <div class="sm:col-span-2">
        <label class="block text-slate-400 mb-1 font-medium">Skill Description</label>
        <input id="sc-desc" type="text" placeholder="Action-oriented description for Antigravity model decision..." class="w-full bg-slate-900 border border-slate-700/80 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-indigo-500" />
      </div>
    </div>

    <div class="flex items-center justify-between pt-2">
      <div class="text-[11px] text-slate-400">
        Creates isolated virtual environment in <code>envs/&lt;name&gt;/</code> managed by <code>uv</code>.
      </div>
      <button onclick="runScaffoldSkill()" id="btn-sc-run" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg transition shadow-sm">
        Scaffold Skill
      </button>
    </div>
  </div>

  <!-- Output Box -->
  <div id="sc-output-box" class="p-3 bg-black/70 rounded-xl border border-slate-900 text-xs font-mono text-slate-300 max-h-56 overflow-y-auto whitespace-pre-wrap hidden"></div>
</div>

<script>
async function runScaffoldSkill() {
  const name = document.getElementById('sc-name').value.trim();
  const desc = document.getElementById('sc-desc').value.trim();
  const pkgs = document.getElementById('sc-pkgs').value.trim();
  if (!name || !desc) return alert('Name and description are required');

  const btn = document.getElementById('btn-sc-run');
  const out = document.getElementById('sc-output-box');
  btn.disabled = true;
  btn.textContent = 'Creating...';
  out.classList.remove('hidden');
  out.textContent = `Scaffolding ${name}...`;

  const args = ['create', name, '--description', desc];
  if (pkgs) {
    args.push('--packages', ...pkgs.split(/\s+/));
  }

  try {
    const res = await window.AgentBridge.runSkill('skill-creator', 'main.py', args);
    out.textContent = res.output;
    window.AgentBridge.refresh();
  } catch (err) {
    out.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Scaffold Skill';
  }
}
</script>
