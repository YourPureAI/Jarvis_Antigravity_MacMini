<div class="space-y-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Card 1: Local Network Tools -->
    <div class="p-4 rounded-xl bg-slate-950/80 border border-slate-800 space-y-3">
      <div class="text-xs font-semibold text-slate-300 flex items-center justify-between">
        <span>🌐 Local Network Reachability & SSH</span>
      </div>
      
      <!-- Ping Tool -->
      <div class="space-y-1.5">
        <label class="block text-[11px] font-medium text-slate-400">Ping Host / IP</label>
        <div class="flex gap-2">
          <input id="hdc-ping-host" type="text" value="192.168.1.100" placeholder="192.168.1.100 or macmini" class="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-mono" />
          <button onclick="runHdcPing()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition">
            Ping
          </button>
        </div>
      </div>

      <!-- Remote SSH Command -->
      <div class="space-y-1.5 pt-1">
        <label class="block text-[11px] font-medium text-slate-400">Remote SSH Command</label>
        <div class="flex gap-2">
          <input id="hdc-ssh-host" type="text" value="macmini" class="w-24 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-mono" />
          <input id="hdc-ssh-cmd" type="text" value="sw_vers" placeholder="Command (e.g. uptime)" class="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-mono" />
          <button onclick="runHdcSsh()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg transition shadow-sm">
            Run
          </button>
        </div>
      </div>
    </div>

    <!-- Card 2: Home Assistant REST Control -->
    <div class="p-4 rounded-xl bg-slate-950/80 border border-slate-800 space-y-3">
      <div class="text-xs font-semibold text-slate-300 flex items-center justify-between">
        <span>🏠 Home Assistant Controller</span>
        <span class="text-[10px] text-slate-500">Requires HASS_TOKEN</span>
      </div>

      <!-- Entity State -->
      <div class="space-y-1.5">
        <label class="block text-[11px] font-medium text-slate-400">Inspect Entity State</label>
        <div class="flex gap-2">
          <input id="hdc-entity" type="text" placeholder="light.living_room or sensor.temp" class="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-mono" />
          <button onclick="runHdcState()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition">
            Check State
          </button>
        </div>
      </div>

      <!-- Service Call -->
      <div class="space-y-1.5 pt-1">
        <label class="block text-[11px] font-medium text-slate-400">Call Service</label>
        <div class="flex gap-2">
          <input id="hdc-domain" type="text" placeholder="light" class="w-20 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 font-mono" />
          <input id="hdc-service" type="text" placeholder="turn_on" class="w-24 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 font-mono" />
          <button onclick="runHdcCall()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium rounded-lg transition shadow-sm">
            Call Service
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Output Box -->
  <div id="hdc-output-box" class="p-3 bg-black/70 rounded-xl border border-slate-900 text-xs font-mono text-slate-300 max-h-56 overflow-y-auto whitespace-pre-wrap hidden"></div>
</div>

<script>
async function runHdcPing() {
  const host = document.getElementById('hdc-ping-host').value.trim();
  const out = document.getElementById('hdc-output-box');
  out.classList.remove('hidden');
  out.textContent = `Pinging ${host}...`;
  const res = await window.AgentBridge.runSkill('home-device-control', 'main.py', ['ping', host]);
  out.textContent = res.output;
}

async function runHdcSsh() {
  const host = document.getElementById('hdc-ssh-host').value.trim();
  const cmd = document.getElementById('hdc-ssh-cmd').value.trim();
  const out = document.getElementById('hdc-output-box');
  out.classList.remove('hidden');
  out.textContent = `Executing ssh ${host} "${cmd}"...`;
  const res = await window.AgentBridge.runSkill('home-device-control', 'main.py', ['ssh', host, cmd]);
  out.textContent = res.output;
}

async function runHdcState() {
  const ent = document.getElementById('hdc-entity').value.trim();
  const out = document.getElementById('hdc-output-box');
  out.classList.remove('hidden');
  out.textContent = `Querying Home Assistant for ${ent || 'all states'}...`;
  const args = ent ? ['state', ent] : ['state'];
  const res = await window.AgentBridge.runSkill('home-device-control', 'main.py', args);
  out.textContent = res.output;
}

async function runHdcCall() {
  const dom = document.getElementById('hdc-domain').value.trim();
  const svc = document.getElementById('hdc-service').value.trim();
  const out = document.getElementById('hdc-output-box');
  out.classList.remove('hidden');
  out.textContent = `Calling service ${dom}.${svc}...`;
  const res = await window.AgentBridge.runSkill('home-device-control', 'main.py', ['call', dom, svc]);
  out.textContent = res.output;
}
</script>
