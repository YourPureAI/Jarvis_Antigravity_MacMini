<div class="space-y-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Tool 1: URL Content Fetcher -->
    <div class="p-4 rounded-xl bg-slate-950/80 border border-slate-800 space-y-3">
      <div class="text-xs font-semibold text-slate-300">🌐 Web Page Scraper & Digest</div>
      <div class="flex gap-2">
        <input id="wr-url" type="text" placeholder="https://news.ycombinator.com or article URL" class="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-mono" />
        <button onclick="runWrFetch()" id="btn-wr-fetch" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg transition shadow-sm">
          Fetch & Clean
        </button>
      </div>
      <p class="text-[10px] text-slate-500">Strips ads, styling, scripts, and extracts clean markdown/text content.</p>
    </div>

    <!-- Tool 2: Search Research Notes -->
    <div class="p-4 rounded-xl bg-slate-950/80 border border-slate-800 space-y-3">
      <div class="text-xs font-semibold text-slate-300">🔍 Search Saved Research (FTS5)</div>
      <div class="flex gap-2">
        <input id="wr-query" onkeydown="if(event.key==='Enter') runWrSearch()" type="text" placeholder="Search keywords in saved digests..." class="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" />
        <button onclick="runWrSearch()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition">
          Search
        </button>
        <button onclick="runWrList()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg border border-slate-700 transition" title="Show all recent">
          Recent
        </button>
      </div>
      <p class="text-[10px] text-slate-500">Queries local SQLite database at <code>data/skills/web-researcher/research.db</code>.</p>
    </div>
  </div>

  <!-- Quick Save Note Accordion -->
  <details class="bg-slate-950/80 border border-slate-800 rounded-xl p-3.5 group">
    <summary class="text-xs font-semibold text-indigo-400 cursor-pointer list-none flex items-center justify-between">
      <span>➕ Save New Research Note to Database</span>
      <span class="text-slate-500 group-open:rotate-180 transition">▼</span>
    </summary>
    <div class="space-y-2 pt-3 text-xs">
      <input id="wr-note-title" type="text" placeholder="Title" class="w-full bg-slate-900 border border-slate-700/80 rounded-lg p-2 text-slate-200" />
      <textarea id="wr-note-summary" rows="3" placeholder="Summary or research synthesis..." class="w-full bg-slate-900 border border-slate-700/80 rounded-lg p-2 text-slate-200"></textarea>
      <div class="flex gap-2">
        <input id="wr-note-url" type="text" placeholder="Source URL (optional)" class="flex-1 bg-slate-900 border border-slate-700/80 rounded-lg p-2 text-slate-200" />
        <input id="wr-note-tags" type="text" placeholder="Tags (e.g. ai, apple)" class="w-48 bg-slate-900 border border-slate-700/80 rounded-lg p-2 text-slate-200" />
        <button onclick="runWrSave()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg">Save</button>
      </div>
    </div>
  </details>

  <!-- Output Box -->
  <div id="wr-output-box" class="p-3 bg-black/70 rounded-xl border border-slate-900 text-xs font-mono text-slate-300 max-h-72 overflow-y-auto whitespace-pre-wrap hidden"></div>
</div>

<script>
async function runWrFetch() {
  const url = document.getElementById('wr-url').value.trim();
  if (!url) return;
  const btn = document.getElementById('btn-wr-fetch');
  const out = document.getElementById('wr-output-box');
  btn.disabled = true;
  btn.textContent = 'Fetching...';
  out.classList.remove('hidden');
  out.textContent = `Scraping clean text from ${url}...`;

  try {
    const res = await window.AgentBridge.runSkill('web-researcher', 'main.py', ['fetch', url]);
    out.textContent = res.output;
  } catch (err) {
    out.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Fetch & Clean';
  }
}

async function runWrSearch() {
  const q = document.getElementById('wr-query').value.trim();
  const out = document.getElementById('wr-output-box');
  out.classList.remove('hidden');
  out.textContent = `Searching research notes for "${q}"...`;
  const res = await window.AgentBridge.runSkill('web-researcher', 'main.py', ['search', q || '*']);
  out.textContent = res.output;
}

async function runWrList() {
  const out = document.getElementById('wr-output-box');
  out.classList.remove('hidden');
  out.textContent = 'Loading recent research notes...';
  const res = await window.AgentBridge.runSkill('web-researcher', 'main.py', ['list', '--limit', '10']);
  out.textContent = res.output;
}

async function runWrSave() {
  const title = document.getElementById('wr-note-title').value.trim();
  const summary = document.getElementById('wr-note-summary').value.trim();
  const url = document.getElementById('wr-note-url').value.trim();
  const tags = document.getElementById('wr-note-tags').value.trim();
  if (!title || !summary) return alert('Title and summary required');

  const out = document.getElementById('wr-output-box');
  out.classList.remove('hidden');
  out.textContent = 'Saving note to database...';
  const args = ['save', title, summary];
  if (url) args.push('--url', url);
  if (tags) args.push('--tags', tags);

  const res = await window.AgentBridge.runSkill('web-researcher', 'main.py', args);
  out.textContent = res.output;
}
</script>
